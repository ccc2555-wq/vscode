<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人名片</title>
  <!-- 引入外部样式文件，实现结构与样式分离 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 名片主体：居中卡片 -->
  <main class="card">

    <!-- 圆形头像区域，使用内嵌 SVG 作为默认头像图标 -->
    <div class="avatar">
      <svg viewBox="0 0 24 24" width="56" height="56" fill="#ffffff" aria-hidden="true">
        <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.5h19.6v-2.5c0-3.3-6.5-4.9-9.8-4.9z"/>
      </svg>
    </div>

    <!-- 姓名 -->
    <h1 class="name">张伟</h1>

    <!-- 职位 -->
    <p class="position">高级前端开发工程师</p>

    <!-- 分隔线 -->
    <hr class="divider">

    <!-- 联系方式列表 -->
    <ul class="contact-list">
      <li class="contact-item">
        <span class="contact-icon">📧</span>
        <span class="contact-text">zhangwei@example.com</span>
      </li>
      <li class="contact-item">
        <span class="contact-icon">📱</span>
        <span class="contact-text">138-0000-0000</span>
      </li>
      <li class="contact-item">
        <span class="contact-icon">📍</span>
        <span class="contact-text">中国 · 上海</span>
      </li>
    </ul>

  </main>

</body>
</html>
